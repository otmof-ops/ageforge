[package]
name = "ageforge_core"
version = "0.1.0"
edition = "2021"
description = "The Realm of Ages world: every system that runs it, year by year."
license = "BSD-3-Clause"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[features]
# the Python extension module (realm_of_ages._core), used by the reference engine's checks
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.23", optional = true }
serde = "1"
serde_json = "1"
