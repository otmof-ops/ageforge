[package]
name = "ageforge_core"
version = "0.1.0"
edition = "2021"
description = "The heavy yearly work of the Realm of Ages simulation, as a Python extension module."
license = "BSD-3-Clause"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
